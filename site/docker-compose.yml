# Site do Reunilo (reunilo.meneseslabs.com.br), publicado pelo Caddy (stack /opt/caddy).
# O endereço antigo, escriba.meneseslabs.com.br, redireciona para o novo (301).
# Arquivos estáticos em ./public: editar e recarregar o navegador, sem reiniciar.
services:
  reunilo-site:
    image: caddy:2-alpine
    container_name: reunilo-site
    restart: unless-stopped
    command: caddy file-server --root /srv
    labels:
      caddy_0: reunilo.meneseslabs.com.br
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_0.encode: zstd gzip
      caddy_0.header.Strict-Transport-Security: "max-age=31536000"
      caddy_0.header.X-Content-Type-Options: nosniff
      caddy_0.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy_1: escriba.meneseslabs.com.br
      caddy_1.redir: "https://reunilo.meneseslabs.com.br{uri} permanent"
    networks:
      - caddy
    volumes:
      - ./public:/srv:ro

  # Formulário de contato (/api/contato). O destino e a senha do SMTP ficam em contato.env, só na VPS.
  reunilo-contato:
    image: python:3.12-alpine
    container_name: reunilo-contato
    restart: unless-stopped
    command: python -u /app/server.py
    env_file:
      - path: ./contato.env
        required: false
    labels:
      caddy: reunilo.meneseslabs.com.br
      caddy.reverse_proxy: "/api/* {{upstreams 8080}}"
    networks:
      - caddy
    volumes:
      - ./contato:/app:ro
      - ./dados:/data

networks:
  caddy:
    external: true
