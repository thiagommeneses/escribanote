<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reunilo — PDF</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f3f4f6; font: 14px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #16181d; }
    .bar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .bar button { border: 0; background: #2f6bff; color: #fff; border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    .doc { max-width: 780px; margin: 24px auto; background: #fff; padding: 48px 56px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 16px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #2f6bff; }
    h3 { font-size: 14px; margin: 14px 0 4px; }
    p { margin: 6px 0; }
    blockquote { margin: 8px 0; padding: 6px 12px; background: #fff8e1; border-left: 3px solid #f3d98b; border-radius: 4px; }
    li.task { list-style: none; margin-left: -18px; }
    .foot { color: #9ca3af; font-size: 11px; margin-top: 32px; text-align: center; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .doc { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      h2 { break-after: avoid; }
      p, blockquote, img { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="bar"><span>Use “Salvar como PDF” na janela de impressão.</span><button id="print">Imprimir / Salvar PDF</button></div>
  <article class="doc" id="doc">Carregando…</article>
  <script type="module" src="print.js"></script>
</body>
</html>
