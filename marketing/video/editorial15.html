<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escribanote — 15 s editorial (9:16)</title>
<link rel="stylesheet" href="../../site/fonts.css">
<style>
  :root {
    --ink: #141414; --paper: #f3ead8; --paper-2: #e9dfca; --orange: #d9583a; --marker: #f0c53a; --white: #f7f2e8; --mute: #9a8b73;
    --serif: "Fraunces", Georgia, serif; --sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: var(--sans); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .scene.on { opacity: 1; }
  .dark { background: var(--ink); color: var(--white); }
  .cream { background: var(--paper); color: var(--ink); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .10; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  .glow { position: absolute; left: -400px; top: 500px; width: 1880px; height: 1400px; background: radial-gradient(50% 50% at 50% 50%, rgba(217,88,58,.35) 0%, rgba(217,88,58,0) 70%); }
  .word { position: absolute; left: 70px; right: 70px; font-family: var(--serif); font-weight: 600; line-height: .92; letter-spacing: -0.035em; opacity: 0; transform-origin: 0% 100%; }
  .word.it { font-style: italic; }
  .word.o { color: var(--orange); }
  .word.y { color: var(--marker); }
  .kicker { position: absolute; left: 70px; top: 130px; font-family: var(--sans); font-weight: 800; font-size: 46px; letter-spacing: .02em; opacity: 0; z-index: 5; background: rgba(20,20,20,.88); padding: 18px 30px; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .kicker b { color: var(--orange); }
  .line { position: absolute; left: 70px; height: 14px; background: var(--orange); transform-origin: left; transform: scaleX(0); }

  /* dispositivo com o painel real */
  .device { position: absolute; left: 50%; top: 50%; width: 760px; height: 1540px; margin: -720px 0 0 -380px; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 50px 140px rgba(0,0,0,.65), 0 0 0 2px rgba(255,255,255,.08); transform-origin: 50% 50%; }
  .device img { position: absolute; left: 0; top: 0; width: 760px; height: auto; transform-origin: 0 0; }
  .device .hl { position: absolute; left: 14px; width: 732px; height: 66px; border: 5px solid var(--orange); border-radius: 16px; opacity: 0; box-shadow: 0 0 0 6px rgba(217,88,58,.25); }
  .tag { position: absolute; font-family: var(--sans); font-weight: 800; font-size: 44px; padding: 16px 30px; border-radius: 999px; background: var(--orange); color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.5); opacity: 0; white-space: nowrap; }
  .tag.y { background: var(--marker); color: var(--ink); }
  .tag.w { background: var(--white); color: var(--ink); }
  .hl { position: absolute; border: 6px solid var(--orange); border-radius: 18px; opacity: 0; box-shadow: 0 0 0 6px rgba(217,88,58,.25); }
  .stampbig { position: absolute; left: 0; right: 0; top: 260px; font-family: var(--serif); font-weight: 700; font-style: italic; font-size: 240px; line-height: .85; letter-spacing: -0.05em; color: var(--orange); text-align: center; transform: rotate(-7deg); opacity: 0; text-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .brand { position: absolute; left: 0; right: 0; top: 560px; text-align: center; }
  .brand img { width: 300px; height: 300px; border-radius: 72px; box-shadow: 0 40px 100px rgba(0,0,0,.35); }
  .brand .nm { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 150px; letter-spacing: -0.04em; line-height: 1; margin-top: 50px; }
  .brand .tg { font-family: var(--sans); font-size: 44px; color: #5a4a35; margin-top: 16px; }
  .badge { position: absolute; top: 1120px; font-family: var(--sans); font-weight: 800; font-size: 54px; padding: 22px 46px; border-radius: 999px; background: var(--white); color: var(--ink); opacity: 0; }
  .url { position: absolute; left: 70px; right: 70px; top: 1300px; text-align: center; font-family: var(--sans); font-weight: 800; font-size: 54px; padding: 30px 0; border-radius: 999px; background: var(--orange); color: #fff; opacity: 0; letter-spacing: -0.01em; }
  .small { position: absolute; left: 70px; right: 70px; top: 1460px; text-align: center; font-family: var(--sans); font-size: 38px; color: var(--mute); opacity: 0; }
  .wipe { position: absolute; inset: 0; background: var(--orange); transform: translateX(100%); }
</style>
</head>
<body>
<div id="stage">
  <!-- 1 · UMA HORA / DE REUNIÃO. -->
  <section class="scene dark" id="s1">
    <div class="word" id="w1a" style="top:620px;font-size:230px">UMA<br>HORA</div>
    <div class="word it y" id="w1b" style="top:1110px;font-size:170px">de reunião.</div>
  </section>
  <!-- 2 · E ninguém anotou nada. -->
  <section class="scene cream" id="s2">
    <div class="word" id="w2a" style="top:560px;font-size:200px">E ninguém</div>
    <div class="word" id="w2b" style="top:790px;font-size:200px">anotou</div>
    <div class="word it o" id="w2c" style="top:1020px;font-size:300px">nada.</div>
    <div class="line" id="l2" style="top:1330px;width:940px"></div>
  </section>
  <!-- 3 · transcreve ao vivo (painel real) -->
  <section class="scene dark" id="s3">
    <div class="glow"></div>
    <div class="kicker" id="k3">TRANSCREVE <b>AO VIVO.</b></div>
    <div class="device" id="d3"><img id="d3img" src="../remotion/public/capturas/11-painel-transcricao.png" alt=""><div class="hl" id="hl3" style="top:196px"></div></div>
    <div class="tag" id="t3a" style="left:40px;top:640px;transform:rotate(-6deg)">Ana Teixeira</div>
    <div class="tag y" id="t3b" style="right:30px;top:860px;transform:rotate(5deg)">Bruno Lima</div>
    <div class="tag w" id="t3c" style="left:90px;top:1120px;transform:rotate(-4deg)">Paula Franco</div>
    <div class="kicker" id="k3b" style="top:1700px;left:auto;right:70px">com o <b>nome</b> de quem falou</div>
  </section>
  <!-- 4 · ata pronta (painel IA real) -->
  <section class="scene dark" id="s4">
    <div class="glow" style="top:900px"></div>
    <div class="kicker" id="k4">ACABOU A CHAMADA?</div>
    <div class="device" id="d4" style="height:690px;margin-top:-345px"><img id="d4img" src="../remotion/public/capturas/12-painel-ia.png" alt=""></div>
    <div class="stampbig" id="st4">ATA<br>PRONTA.</div>
  </section>
  <!-- 5 · marca -->
  <section class="scene cream" id="s5">
    <div class="brand" id="b5"><img src="../../site/img/icon.png" alt=""><div class="nm">Escribanote</div><div class="tg">Cada palavra da reunião, anotada.</div></div>
  </section>
  <!-- 6 · grátis / chrome / edge / url -->
  <section class="scene dark" id="s6">
    <div class="word it y" id="w6" style="top:520px;font-size:320px;left:0;right:0;text-align:center">Grátis.</div>
    <div class="badge" id="bd1" style="left:200px">Chrome</div>
    <div class="badge" id="bd2" style="left:580px">Edge</div>
    <div class="url" id="u6">escribanote.com</div>
    <div class="small" id="sm6">Tudo fica no seu computador.</div>
  </section>
  <div class="wipe" id="wipe"></div>
  <div class="grain"></div>
</div>

<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const P = (t, s, d) => clamp((t - s) / d);
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x) => 1 + 2.6 * Math.pow(x - 1, 3) + 1.6 * Math.pow(x - 1, 2);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const $ = (id) => document.getElementById(id);
window.DURATION = 15.1;

// palavra "batendo": cai de cima com escala e leve overshoot
function slam(el, t, s, d = 0.22) {
  const p = P(t, s, d);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `translateY(${(1 - outBack(p)) * -60}px) scale(${0.92 + 0.08 * outBack(p)})`;
}
// entrada por "chicote": vem da direita com desfoque
function whip(el, t, s, d = 0.32, from = 1) {
  const p = outExpo(P(t, s, d));
  el.style.transform = `translateX(${(1 - p) * 1080 * from}px)`;
  el.style.filter = `blur(${(1 - p) * 16}px)`;
}
function pop(el, t, s, d = 0.3, rot = 0) {
  const p = P(t, s, d);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `rotate(${rot}deg) scale(${0.4 + 0.6 * outBack(p)})`;
}
const shake = (t, s, d, amp) => { const p = P(t, s, d); if (p <= 0 || p >= 1) return 0; return Math.sin(t * 95) * amp * (1 - p); };

// Cortes (segundos) — da narração: "Uma hora de reunião." 0.2 · "E ninguém anotou nada." 2.08 ·
// "O Escribanote transcreve ao vivo" 3.64 · "com o nome de quem falou" 5.7 · "Acabou a chamada?" 7.33 ·
// "A ata já está pronta." 9.21 · "Escribanote." 10.86 · "Grátis para instalar no Chrome e no Edge." 12.31
const CUTS = [["s1", 0], ["s2", 2.0], ["s3", 3.55], ["s4", 7.25], ["s5", 10.8], ["s6", 12.25], [null, 15.1]];

window.seek = function (t) {
  for (let i = 0; i < CUTS.length - 1; i++) {
    const [id, s] = CUTS[i];
    const el = $(id);
    const on = t >= s && t < CUTS[i + 1][1];
    el.classList.toggle("on", on);
    el.style.opacity = on ? 1 : 0;
  }
  // chicote laranja nos cortes 3 e 4 (uma faixa cruza a tela)
  const wipeAt = [3.42, 7.12, 10.7, 12.15];
  let wp = -1;
  for (const w of wipeAt) { const p = P(t, w, 0.26); if (p > 0 && p < 1) wp = p; }
  $("wipe").style.transform = wp < 0 ? "translateX(100%)" : `translateX(${100 - 200 * inOut(wp)}%)`;

  // 1
  const sh1 = shake(t, 0.15, 0.3, 14) + shake(t, 0.75, 0.3, 10);
  $("s1").style.transform = `translate(${sh1}px, 0) scale(${1 + 0.06 * P(t, 0, 2.0)})`;
  slam($("w1a"), t, 0.15);
  slam($("w1b"), t, 0.75);
  // 2
  $("s2").style.transform = `scale(${1 + 0.05 * P(t, 2.0, 1.55)})`;
  slam($("w2a"), t, 2.08);
  slam($("w2b"), t, 2.4);
  slam($("w2c"), t, 2.75, 0.26);
  $("l2").style.transform = `scaleX(${outExpo(P(t, 3.05, 0.35))})`;
  // 3 · dispositivo
  whip($("d3"), t, 3.55);
  const z3 = 1.28 + 0.16 * inOut(P(t, 3.9, 3.3));
  const y3 = 300 - 160 * inOut(P(t, 3.9, 3.3));
  $("d3").style.transform += ` translateY(${y3}px) scale(${z3})`;
  $("d3img").style.transform = `scale(${760 / 1260}) translateY(-110px)`;
  $("k3").style.opacity = P(t, 3.75, 0.25);
  $("k3").style.transform = `translateY(${(1 - outExpo(P(t, 3.75, 0.3))) * 30}px)`;
  // destaque nos chips dos participantes (posição na tela, acompanhando o zoom)
  $("hl3").style.opacity = P(t, 4.6, 0.2) * (1 - P(t, 5.7, 0.2));
  $("hl3").style.transform = `scale(${1 + 0.03 * Math.sin(t * 12)})`;
  pop($("t3a"), t, 5.7, 0.3, -6);
  pop($("t3b"), t, 5.9, 0.3, 5);
  pop($("t3c"), t, 6.1, 0.3, -4);
  $("k3b").style.opacity = P(t, 6.2, 0.25);
  // 4 · ata
  whip($("d4"), t, 7.25);
  const z4 = 1.42 + 0.1 * inOut(P(t, 7.6, 3.0));
  $("d4").style.transform += ` translateY(${60 - 50 * inOut(P(t, 7.6, 3))}px) scale(${z4})`;
  $("d4img").style.transform = `scale(${760 / 1260}) translateY(-480px)`;
  $("k4").style.opacity = P(t, 7.4, 0.25);
  const st = P(t, 9.15, 0.22);
  const stamp = $("st4");
  stamp.style.opacity = st > 0 ? 1 : 0;
  stamp.style.transform = `rotate(-7deg) scale(${2.2 - 1.2 * outExpo(st)})`;
  $("s4").style.transform = `translate(${shake(t, 9.2, 0.3, 12)}px, 0)`;
  // 5 · marca
  const b = outBack(P(t, 10.85, 0.4));
  $("b5").style.transform = `scale(${0.6 + 0.4 * b})`;
  $("b5").style.opacity = P(t, 10.85, 0.15);
  $("s5").style.transform = `scale(${1 + 0.04 * P(t, 10.8, 1.5)})`;
  // 6 · grátis
  slam($("w6"), t, 12.35, 0.26);
  pop($("bd1"), t, 13.2, 0.3, -3);
  pop($("bd2"), t, 13.45, 0.3, 3);
  $("u6").style.opacity = P(t, 13.9, 0.2);
  $("u6").style.transform = `translateY(${(1 - outBack(P(t, 13.9, 0.4))) * 60}px)`;
  $("sm6").style.opacity = P(t, 14.3, 0.3);
  return true;
};
if (!navigator.webdriver && !location.search.includes("still")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else seek(Number(new URLSearchParams(location.search).get("t") || 0));
</script>
</body>
</html>
